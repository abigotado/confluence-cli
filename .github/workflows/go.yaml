name: go

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Verify module checksums
        run: go mod verify

      - name: Vulnerability scan
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: go build
        run: go build ./...

      - name: Darwin credential backend build modes
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go build -o "${RUNNER_TEMP}/confluence-cli-native" ./cmd/confluence-cli
          CGO_ENABLED=1 go list -f '{{join .CgoFiles "\n"}}' ./internal/auth \
            | grep -Fxq 'keychain_darwin.go'
          otool -L "${RUNNER_TEMP}/confluence-cli-native" | grep -Fq '/Security.framework/'
          if grep -aFq '/usr/bin/security' "${RUNNER_TEMP}/confluence-cli-native"; then
            echo "::error::native Darwin binary contains the forbidden security subprocess path"
            exit 1
          fi
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/confluence-cli-unsupported" ./cmd/confluence-cli
          CGO_ENABLED=0 go list -f '{{join .GoFiles "\n"}}' ./internal/auth \
            | grep -Fxq 'keychain_unsupported.go'

      - name: Darwin CGO-disabled tests
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: 0
        run: go test ./...

      # -race is not optional here: the client paces and retries from shared
      # state, and a data race there would surface as a wrong rate-limit
      # decision rather than a crash.
      - name: go test
        run: go test -race ./...

      - name: goreleaser check and portable policy
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          goreleaser check
          ruby .github/scripts/verify-portable-release-policy_test.rb
          ruby .github/scripts/verify-portable-release-policy.rb .goreleaser.yaml
          expected_commit=$(git rev-parse HEAD)
          commit_epoch=$(git show -s --format=%ct HEAD)
          expected_commit_time=$(date --utc --date="@${commit_epoch}" '+%Y-%m-%dT%H:%M:%SZ')
          goreleaser release --snapshot --clean --skip=publish
          version=$(jq -r '.version' dist/metadata.json)
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error::snapshot metadata carries no version"
            exit 1
          fi
          for artifact in \
            "dist/confluence-cli_${version}_linux_amd64.tar.gz" \
            "dist/confluence-cli_${version}_linux_arm64.tar.gz" \
            "dist/confluence-cli_${version}_windows_amd64.zip" \
            "dist/confluence-cli_${version}_windows_arm64.zip" \
            "dist/confluence-cli_${version}_checksums.txt"; do
            if [ ! -f "${artifact}" ]; then
              echo "::error::snapshot is missing ${artifact}"
              exit 1
            fi
          done
          if find dist -type f \( -iname '*darwin*' -o -name '*.rb' \) -print -quit | grep -q .; then
            echo "::error::snapshot generated a forbidden Darwin or Homebrew artifact"
            exit 1
          fi
          (
            cd dist
            sha256sum -c "confluence-cli_${version}_checksums.txt"
          )
          smoke_dir="${RUNNER_TEMP}/confluence-cli-release-smoke"
          mkdir -p "${smoke_dir}"
          tar -xzf "dist/confluence-cli_${version}_linux_amd64.tar.gz" -C "${smoke_dir}"
          response=$("${smoke_dir}/confluence-cli" version -o json \
            --fields version,commit,commit_time)
          got=$(jq -r '.data.version' <<<"${response}")
          if [ "${got}" != "v${version}" ]; then
            echo "::error::snapshot binary reports '${got}', expected 'v${version}'"
            exit 1
          fi
          commit=$(jq -r '.data.commit' <<<"${response}")
          commit_time=$(jq -r '.data.commit_time' <<<"${response}")
          if [ "${commit}" != "${expected_commit}" ]; then
            echo "::error::snapshot binary reports commit '${commit}', expected '${expected_commit}'"
            exit 1
          fi
          if [ "${commit_time}" != "${expected_commit_time}" ]; then
            echo "::error::snapshot binary reports commit time '${commit_time}', expected '${expected_commit_time}'"
            exit 1
          fi

      # Validate workflow expressions and every shell block. Pinned so an
      # unrelated pull request cannot turn red because a linter changed itself.
      - name: actionlint
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # actionlint falls back to workflow-syntax-only when shellcheck is
          # missing, and reports success having checked no shell at all.
          # ubuntu-latest ships it; assert that rather than assume it, because
          # the failure mode is silent loss of coverage.
          if ! command -v shellcheck >/dev/null; then
            echo "::error::shellcheck is not installed; actionlint would skip every run: block"
            exit 1
          fi
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint

      # The generated contract is what agents read. If regenerating changes it,
      # the committed copy no longer matches internal/errx.
      - name: Generated contract is current
        run: |
          go generate ./...
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::go generate changed tracked files; commit the result:"
            echo "$DIRTY"
            git diff
            exit 1
          fi

  windows-safety:
    name: Windows fail-closed safety
    runs-on: windows-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Skill mutation fails closed
        run: go test -race -run '^TestWindowsSkillMutationFailsClosed$' ./internal/skills

      - name: Build unsupported credential backend
        run: go build ./cmd/confluence-cli

  required:
    name: Build and test
    if: ${{ always() }}
    needs: [test, windows-safety]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all build jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-safety.result }}
        run: |
          if [ "${TEST_RESULT}" != "success" ] || [ "${WINDOWS_RESULT}" != "success" ]; then
            echo "::error::test=${TEST_RESULT}, windows-safety=${WINDOWS_RESULT}"
            exit 1
          fi
